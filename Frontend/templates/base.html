<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedSolve | {% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MainFont';
            src: url("{{ url_for('static', filename='mainfont.otf') }}") format('opentype');
        }

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --nav-bg: rgba(15, 23, 42, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-top: 80px; 
        }

        /* --- GLOBAL NAVBAR --- */
        nav {
            position: fixed;
            top: 0; width: 100%; height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
        }

        .nav-logo {
            font-family: 'MainFont', sans-serif;
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .nav-logo span { color: var(--accent-blue); }

        .nav-links { display: flex; gap: 2rem; list-style: none; }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--accent-blue); }

        /* THIS IS THE "HOLE" WHERE CONTENT GOES */
        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">SPEED<span>SOLVE</span></a>
        <ul class="nav-links">
            <li><a href="/trainer">Trainer</a></li>
            <li><a href="/solver">Solver</a></li>
            <li><a href="/stats">Stats</a></li>
            <li><a href="/login">Logout</a></li>
        </ul>
    </nav>

    <div class="content-wrapper">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
