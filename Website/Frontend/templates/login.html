<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>SpeedSolve | Join the Race</title>
    
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap' rel='stylesheet'>

    <style>
        /* 1. FONT AND VARIABLES */
        @font-face {
            font-family: 'MainFont';
            /* Flask will look for this in your static folder */
            src: url('{{ url_for('static', filename='mainfont.otf') }}') format('opentype');
        }

        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7); /* Translucent for glass effect */
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --input-bg: #0f172a;
            --transition: all 0.3s ease;
        }

        /* 2. LAYOUT */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'MainFont', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 3. BACKGROUND IMAGE WITH OVERLAY */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Adds a dark tint over your image so text stays readable */
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('{{ url_for('static', filename='home-background.jpg') }}') no-repeat center center fixed;
            background-size: cover;
            z-index: -1;
        }

        /* 4. THE AUTH CARD */
        .auth-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            backdrop-filter: blur(10px); /* Modern frosted glass effect */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-weight: 800;
            letter-spacing: -1px;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        .form-header h1 span {
            color: var(--accent-blue);
        }

        /* 5. TOGGLE BUTTONS */
        .form-toggle {
            display: flex;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 6px;
            transition: var(--transition);
        }

        .toggle-btn.active {
            background: #1e293b;
            color: var(--accent-blue);
        }

        /* 6. INPUTS AND FORMS */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .main-btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 1rem;
            transition: var(--transition);
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .hidden {
            display: none;
        }

        .forgot-link {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class='background-overlay'></div>

    <div class='auth-container'>
        <div class='form-header'>
            <h1>SPEED<span>SOLVE</span></h1>
            <p style='color: var(--text-dim); margin-top: 5px;'>Ready to break your PB?</p>
        </div>

        <div class='form-toggle'>
            <button class='toggle-btn active' id='login-toggle'>LOGIN</button>
            <button class='toggle-btn' id='signup-toggle'>SIGN UP</button>
        </div>

        <form id='login-form' class='auth-form'>
            <div class='input-group'>
                <label>Email</label>
                <input type='email' placeholder='cuber@example.com' required>
            </div>
            <div class='input-group'>
                <label>Password</label>
                <input type='password' placeholder='••••••••' required>
            </div>
            <button type='submit' class='main-btn'>Enter Arena</button>
            <a href='#' class='forgot-link'>Forgot your password?</a>
        </form>

        <form id='signup-form' class='auth-form hidden'>
            <div class='input-group'>
                <label>Username</label>
                <input type='text' placeholder='Sub10Hunter' required>
            </div>
            <div class='input-group'>
                <label>Email</label>
                <input type='email' placeholder='cuber@example.com' required>
            </div>
            <div class='input-group'>
                <label>Password</label>
                <input type='password' placeholder='••••••••' required>
            </div>
            <button type='submit' class='main-btn'>Join League</button>
        </form>
    </div>

</body>
</html>
